openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: SmartSupport AI API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: chatbots
    description: Chatbot management
  - name: documents
    description: Knowledge base documents
  - name: conversations
    description: Chat conversations
  - name: analytics
    description: Analytics and stats
  - name: widget
    description: Embeddable widget
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /chatbots:
    get:
      operationId: listChatbots
      tags: [chatbots]
      summary: List user's chatbots
      responses:
        "200":
          description: List of chatbots
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Chatbot"
    post:
      operationId: createChatbot
      tags: [chatbots]
      summary: Create a new chatbot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatbotInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Chatbot"

  /chatbots/{id}:
    get:
      operationId: getChatbot
      tags: [chatbots]
      summary: Get a chatbot
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Chatbot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Chatbot"
        "404":
          description: Not found
    patch:
      operationId: updateChatbot
      tags: [chatbots]
      summary: Update a chatbot
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatbotUpdate"
      responses:
        "200":
          description: Updated chatbot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Chatbot"
    delete:
      operationId: deleteChatbot
      tags: [chatbots]
      summary: Delete a chatbot
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /chatbots/{id}/widget-script:
    get:
      operationId: getChatbotWidgetScript
      tags: [chatbots]
      summary: Get the embeddable widget script for a chatbot
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Widget script info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WidgetScript"

  /chatbots/{id}/documents:
    get:
      operationId: listDocuments
      tags: [documents]
      summary: List documents for a chatbot
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Document"
    post:
      operationId: addDocument
      tags: [documents]
      summary: Add a document to a chatbot knowledge base
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"

  /chatbots/{id}/documents/scrape-url:
    post:
      operationId: scrapeUrl
      tags: [documents]
      summary: Fetch and extract text content from a URL
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScrapeUrlInput"
      responses:
        "200":
          description: Scraped content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScrapeUrlResult"
        "400":
          description: Bad request
        "422":
          description: Could not fetch or parse the URL

  /chatbots/{id}/documents/{docId}:
    delete:
      operationId: deleteDocument
      tags: [documents]
      summary: Delete a document
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: docId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /chatbots/{id}/conversations:
    get:
      operationId: listConversations
      tags: [conversations]
      summary: List conversations for a chatbot
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Conversation"

  /chatbots/{id}/conversations/{convId}/messages:
    get:
      operationId: listMessages
      tags: [conversations]
      summary: List messages in a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: convId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"

  /chatbots/{id}/analytics:
    get:
      operationId: getChatbotAnalytics
      tags: [analytics]
      summary: Get analytics for a chatbot
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Chatbot analytics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatbotAnalytics"

  /dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [analytics]
      summary: Get overall dashboard statistics
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /widget/{chatbotUid}/chat:
    post:
      operationId: widgetChat
      tags: [widget]
      summary: Send a message via the embeddable widget (public endpoint)
      parameters:
        - name: chatbotUid
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WidgetMessageInput"
      responses:
        "200":
          description: AI response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WidgetMessageResponse"

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    Chatbot:
      type: object
      required: [id, userId, name, uid, status, createdAt, updatedAt]
      properties:
        id:
          type: integer
        userId:
          type: string
        name:
          type: string
        uid:
          type: string
        description:
          type: ["string", "null"]
        systemPrompt:
          type: ["string", "null"]
        primaryColor:
          type: ["string", "null"]
        logoUrl:
          type: ["string", "null"]
        welcomeMessage:
          type: ["string", "null"]
        status:
          type: string
          enum: [active, inactive, training]
        documentCount:
          type: integer
        conversationCount:
          type: integer
        createdAt:
          type: string
        updatedAt:
          type: string

    ChatbotInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        systemPrompt:
          type: string
        primaryColor:
          type: string
        welcomeMessage:
          type: string

    ChatbotUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        systemPrompt:
          type: string
        primaryColor:
          type: string
        logoUrl:
          type: string
        welcomeMessage:
          type: string
        status:
          type: string
          enum: [active, inactive]

    WidgetScript:
      type: object
      required: [scriptTag, chatbotUid]
      properties:
        scriptTag:
          type: string
        chatbotUid:
          type: string
        embedInstructions:
          type: string

    Document:
      type: object
      required: [id, chatbotId, title, sourceType, status, createdAt]
      properties:
        id:
          type: integer
        chatbotId:
          type: integer
        title:
          type: string
        content:
          type: ["string", "null"]
        sourceType:
          type: string
          enum: [text, url, pdf]
        sourceUrl:
          type: ["string", "null"]
        status:
          type: string
          enum: [pending, processing, ready, error]
        chunkCount:
          type: integer
        createdAt:
          type: string

    DocumentInput:
      type: object
      required: [title, sourceType, content]
      properties:
        title:
          type: string
          minLength: 1
        sourceType:
          type: string
          enum: [text, url, pdf]
        content:
          type: string
        sourceUrl:
          type: string

    Conversation:
      type: object
      required: [id, chatbotId, sessionId, messageCount, createdAt, updatedAt]
      properties:
        id:
          type: integer
        chatbotId:
          type: integer
        sessionId:
          type: string
        visitorId:
          type: ["string", "null"]
        messageCount:
          type: integer
        createdAt:
          type: string
        updatedAt:
          type: string

    Message:
      type: object
      required: [id, conversationId, role, content, createdAt]
      properties:
        id:
          type: integer
        conversationId:
          type: integer
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
        createdAt:
          type: string

    ChatbotAnalytics:
      type: object
      required: [chatbotId, totalConversations, totalMessages, avgMessagesPerConversation, recentConversations]
      properties:
        chatbotId:
          type: integer
        totalConversations:
          type: integer
        totalMessages:
          type: integer
        avgMessagesPerConversation:
          type: number
        recentConversations:
          type: array
          items:
            $ref: "#/components/schemas/Conversation"

    DashboardStats:
      type: object
      required: [totalChatbots, totalDocuments, totalConversations, totalMessages, activeChatbots]
      properties:
        totalChatbots:
          type: integer
        totalDocuments:
          type: integer
        totalConversations:
          type: integer
        totalMessages:
          type: integer
        activeChatbots:
          type: integer

    ScrapeUrlInput:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri

    ScrapeUrlResult:
      type: object
      required: [title, content, url]
      properties:
        title:
          type: string
        content:
          type: string
        url:
          type: string

    WidgetMessageInput:
      type: object
      required: [message, sessionId]
      properties:
        message:
          type: string
        sessionId:
          type: string
        visitorId:
          type: string

    WidgetMessageResponse:
      type: object
      required: [reply, sessionId]
      properties:
        reply:
          type: string
        sessionId:
          type: string
        conversationId:
          type: integer
